_min_copier_version: "9.0.0"

provider:
  type: str
  help: "Which cloud provider will host this Terraform project?"
  choices:
    GCP: gcp
    AWS: aws
  default: gcp

project_name:
  type: str
  help: "Enter the Terraform project name"
  placeholder: "my-project"
  validator: >-
    {% if not (project_name is string and project_name | regex_search('^[A-Za-z0-9-]+$')) %}
    Use one or more alphanumeric characters and dashes only.
    {% endif %}

owner_account:
  type: str
  help: "Enter the owner account"
  validator: >-
    {% if not (owner_account is string and owner_account | trim) %}
    An owner account is required.
    {% elif provider == "aws" and not (owner_account | regex_search('^[0-9]{12}$')) %}
    AWS owner accounts must be 12-digit account IDs.
    {% endif %}

modules:
  type: str
  help: "Enter Terraform module names separated by spaces (leave blank for none)"
  placeholder: "subsystem system"
  default: ""
  validator: >-
    {% set module_names = modules.split() %}
    {% if module_names | unique | list | length != module_names | length %}
    Module names must be unique.
    {% else %}
    {% for module in module_names %}
    {% if module is not string or not (module | regex_search('^[a-z][a-z0-9-]*$')) %}
    Use lowercase kebab-case names beginning with a letter.
    {% endif %}
    {% endfor %}
    {% endif %}

components:
  type: str
  help: "Enter Terraform component names separated by spaces"
  placeholder: "network security"
  validator: >-
    {% set component_names = components.split() %}
    {% if not component_names %}
    Enter at least one component name.
    {% elif component_names | unique | list | length != component_names | length %}
    Component names must be unique.
    {% else %}
    {% for component in component_names %}
    {% if component is not string or not (component | regex_search('^[a-z][a-z0-9-]*$')) %}
    Use lowercase kebab-case names beginning with a letter.
    {% endif %}
    {% endfor %}
    {% endif %}
