      - tree
      # nvim-treesitter's main branch shells out to the tree-sitter CLI
      # to compile parsers; the `tree-sitter` formula is only the library.
      - tree-sitter-cli
      - unzip
      - watch
      - wget
      - whisper-cpp
      - yq
      - zookeeper
      - zsh
      - zsh-autosuggestions
    casks:
      - 1password
      - 1password-cli
      - beyond-compare
      - claude
      - codex
      - docker-desktop
      - firefox
      # Nerd Font patched Meslo -- supplies the glyphs the tide prompt draws.
      # Font casks used to need the homebrew/cask-fonts tap; that was
      # deprecated in 2024 and fonts now live in homebrew/cask itself.
      - font-meslo-lg-nerd-font
      - google-drive
      - iterm2
      - jetbrains-toolbox
      - ngrok
      - notion
      - sizeup
      - slack
      - spotify
      - virtualbox
      - zed
      - zoom

  apt:
    - apt-transport-https
    - awscli
    - base-files
    - bash
    - bash-completion
    - bsdutils
    - ca-certificates
    - coreutils
    - curl
    - dash
    - debianutils
    - diffutils
    - direnv
    - ffmpeg
    - findutils
    - fish
    # fc-cache, for the Nerd Font install below.
    - fontconfig
    - fzf
    - gh
    - git
    - gnupg
    - gpg
    - graphviz
    - grc
    - grep
    - gzip
    - hostname
    - htop
    - iftop
    - init
    - jq
    - kafkacat
    - kubectx
    - lsb-release
    - lsd
    - make
    - mysql-server
    - neovim
    - nmap
    - openssh-client
    - openssh-server
    - pre-commit
    - prometheus
    - protobuf-compiler
    - python3
    - shellcheck
    - sshpass
    - tree
    - ubuntu-minimal
    - ubuntu-wsl
    - unzip
    - util-linux
    - watch
    - wget
    # Unpacks the Nerd Font archive below (.tar.xz).
    - xz-utils
    - yq
    - zip
    - zookeeperd
    - zsh
    - zsh-autosuggestions

  # Linux counterpart of the font-meslo-lg-nerd-font cask above: apt has no
  # Nerd Font package, so install-nerd-font downloads this release asset from
  # github.com/ryanoasis/nerd-fonts and unpacks every .ttf in it into
  # ~/.local/share/fonts/<name>/ (the same files the cask installs).
  # To upgrade, change version and sha256 together; the hash is the archive's
  # line in that release's SHA-256.txt asset.
  nerd_font:
    name: MesloLGNerdFont
    version: v3.5.1
    archive: Meslo.tar.xz
    sha256: 6b6624632dc6873dfb7681c3f818e7c01ab601ab707690b6440933bbe57e2b11
